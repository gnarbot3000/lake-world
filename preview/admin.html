<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <script>
    (function () {
      var q = location.search || "";
      var h = location.hash || "";
      location.replace("../app/club/" + q + h);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=../app/club/">
  <link rel="canonical" href="../app/club/">
</head>
<body>
  <p>Moved to <a href="../app/club/">/app/club/</a>.</p>
</body>
</html>
