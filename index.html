<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>lake.world</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="js/ga.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; min-height: 100dvh; }
    body {
      font-family: ui-rounded, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      color: #fff;
      border: none;
    }
    #splash {
      position: relative;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }
    .poster-stage {
      position: absolute;
      inset: -48%;
      perspective: 1100px;
      pointer-events: none;
    }
    .poster-wall {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: rotateX(12deg) rotateZ(-3deg) scale(1.62);
      transform-origin: center center;
    }
    .poster-row {
      display: flex;
      gap: 16px;
      width: max-content;
      animation: drift 336s linear infinite;
      will-change: transform;
    }
    .poster-row:nth-child(even) {
      animation-name: drift-rev;
      animation-duration: 432s;
    }
    .poster-row:nth-child(3n) { animation-duration: 384s; }
    .poster-row img {
      width: 132px;
      height: 132px;
      object-fit: cover;
      border-radius: 3px;
      flex: 0 0 auto;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .poster-row img.tile-circle { border-radius: 50%; }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @keyframes drift-rev {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,.12) 8%, rgba(0,0,0,.42) 58%, rgba(0,0,0,.62) 100%),
        linear-gradient(to bottom, rgba(0,0,0,.5) 0%, transparent 22%, transparent 78%, rgba(0,0,0,.5) 100%);
      pointer-events: none;
    }
    .splash-nav {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 28px;
    }
    .wordmark {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: lowercase;
    }
    .nav-signin {
      width: auto;
      padding: 8px 18px;
      background: #FC5200;
      border-radius: 4px;
      font-weight: 600;
      font-size: 1rem;
    }
    .nav-signin:hover { background: #ff6a26; }
    .hero {
      position: relative;
      z-index: 3;
      max-width: 640px;
      margin: 8vh auto 0;
      padding: 0 24px 48px;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4.6vw, 3.1rem);
      line-height: 1.15;
      margin: 0 0 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .hero p {
      margin: 0 0 28px;
      color: #ddd;
      font-size: 1.15rem;
    }
    #login-form { max-width: 520px; margin: 0 auto; }
    .auth-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #login-form input {
      flex: 1 1 220px;
      flex-grow: 0;
      height: 48px;
      max-height: 48px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 16px;
      line-height: 1.2;
      box-sizing: border-box;
      color: #fff;
      background: rgba(20,20,20,.72);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    #signin-btn {
      width: auto;
      flex: 0 0 auto;
      padding: 12px 22px;
      height: 48px;
      background: #FC5200;
      border-radius: 4px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    #signin-btn:hover { background: #ff6a26; }
    #signup-btn {
      width: auto;
      margin-top: 4px;
      padding: 10px 18px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-weight: 600;
      font-size: 0.95rem;
    }
    #signup-btn:hover { background: rgba(20,20,20,.45); }
    .preview-link {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      color: #fff;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .preview-link:hover { background: rgba(20,20,20,.45); }
    #auth-error {
      color: #ff6b6b;
      margin-top: 12px;
      display: none;
    }
    @media (max-width: 640px) {
      .poster-row img { width: 96px; height: 96px; }
      .splash-nav { padding: 16px; }
      .auth-row { flex-direction: column; align-items: stretch; }
      #login-form input {
        flex: 0 0 auto;
        width: 100%;
        height: 44px;
        max-height: 44px;
      }
      #signin-btn, #signup-btn { width: 100%; height: 44px; padding: 10px 16px; }
      .preview-link { display: block; width: 100%; box-sizing: border-box; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .poster-row { animation: none; }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="poster-stage" aria-hidden="true">
      <div class="poster-wall">
        <div class="poster-row"></div>
      </div>
    </div>
    <div class="vignette"></div>
    <header class="splash-nav">
      <p class="wordmark">lake.world</p>
      <button type="button" class="nav-signin" id="nav-signin">Sign In</button>
    </header>
    <section class="hero" id="auth-section">
      <h1>Log the lake.</h1>
      <p>Slalom, tricks, club boards.</p>
      <form id="login-form">
        <div class="auth-row">
          <input type="email" id="email" name="email" placeholder="Email" required autocomplete="username">
          <input type="password" id="password" name="password" placeholder="Password" required minlength="6" autocomplete="current-password">
          <button type="submit" id="signin-btn">Sign In</button>
        </div>
        <button type="button" id="signup-btn">Create account</button>
        <a class="preview-link" href="preview/index.html">Preview</a>
      </form>
      <div id="auth-error"></div>
    </section>
  </div>
  <script src="js/splash-wall.js"></script>
  <script src="js/auth-splash.js"></script>
</body>
</html>
